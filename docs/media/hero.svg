.ok{animation:ok 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes ok{0%{opacity:0;transform:translateY(6px)}56.7%{opacity:0;transform:translateY(6px)}59.6%{opacity:1;transform:none}95%{opacity:1;transform:none}97.9%{opacity:0;transform:translateY(6px)}100%{opacity:0;transform:translateY(6px)}}
