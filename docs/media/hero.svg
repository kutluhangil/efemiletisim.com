@keyframes mail{0%{opacity:0;transform:translateY(-14px)}63.3%{opacity:0;transform:translateY(-14px)}66.3%{opacity:1;transform:none}86.7%{opacity:1;transform:none}89.6%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
