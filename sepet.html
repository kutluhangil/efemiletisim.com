<script>
let appliedCoupon = null;
let couponDiscount = 0;

whenCatalogReady(() => {
  const sync = syncCartWithCatalog();
  if (sync.removed)  showToast(`${sync.removed} ürün artık satışta olmadığı için sepetten çıkarıldı.`, 'warning');
  if (sync.repriced) showToast('Sepetinizdeki bazı ürünlerin fiyatı güncellendi.', 'info');
  renderCartPage();
});

function renderCartPage() {
  const cart = getCart();
  const layout = document.getElementById('cart-layout');

  if (cart.length === 0) {
    layout.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon"><svg class="icon" viewBox="0 0 24 24" style="width:3rem;height:3rem"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></div>
        <h3>Sepetiniz Boş</h3>
        <p>Henüz ürün eklemediniz. Harika ürünleri keşfedin!</p>
        <a href="urunler.html" class="btn btn-primary btn-lg"><svg class="icon" viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5"/><path d="M4 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M5 9v10h14V9"/></svg> Alışverişe Başla</a>
      </div>`;
    return;
  }

  const subtotal = getCartSubtotal();
  const shipping = getShippingCost();
  const total    = getCartTotal(couponDiscount);

  layout.innerHTML = `
    <!-- Sol: Ürünler -->
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)">
        <h2 style="font-size:1rem;color:var(--text-secondary)">${cart.length} ürün</h2>
        <button class="btn btn-ghost btn-sm" onclick="clearCart(); renderCartPage()"
                style="color:var(--error);border-color:var(--error)">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/></svg> Sepeti Temizle
        </button>
      </div>
      <div class="cart-items-list">
        ${cart.map(renderCartItem).join('')}
      </div>

      <!-- Alışverişe devam -->
      <div style="margin-top:var(--space-5)">
        <a href="urunler.html" class="btn btn-ghost">
          ← Alışverişe Devam Et
        </a>
      </div>
    </div>

    <!-- Sağ: Özet -->
    <div>
      <div class="price-summary">
        <h3>Sipariş Özeti</h3>

        <div class="price-row">
          <span class="label">Ara Toplam</span>
          <span>${formatPrice(subtotal)}</span>
        </div>
        <div class="price-row free">
          <span class="label"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="2" y="8" width="12" height="8" rx="1"/><path d="M14 11h4l3 3v2h-2"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg> Kargo</span>
          <span>Ücretsiz</span>
        </div>
        ${appliedCoupon ? `
          <div class="price-row" style="color:var(--success)">
            <span class="label"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M9 7v10M15 7v10"/></svg> Kupon (${appliedCoupon.coupon.label})</span>
            <span>-${formatPrice(couponDiscount)}</span>
          </div>` : ''}
        <div class="price-row total">
          <span>Toplam</span>
          <span style="color:var(--primary)">${formatPrice(total)}</span>
        </div>
        <div class="price-row-note">Tüm fiyatlara KDV dahildir.</div>

        <!-- Kupon -->
        <div style="margin-top:var(--space-5)">
          <div class="cart-coupon-label"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M9 7v10M15 7v10"/></svg> Kupon Kodu</div>
          <div class="coupon-input-row">
            <input type="text" id="coupon-input" placeholder="Kod girin..." style="text-transform:uppercase">
            <button class="btn btn-secondary btn-sm" onclick="handleCoupon(this)">Uygula</button>
          </div>
          <div id="coupon-msg" style="font-size:0.8125rem;margin-top:var(--space-2)"></div>
        </div>

        <a href="odeme.html" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-5)">
          <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Ödemeye Geç →
        </a>

        <!-- Güven rozetleri -->
        <div class="cart-trust-badges">
          <span><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Güvenli Ödeme</span>
          <span><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="2" y="8" width="12" height="8" rx="1"/><path d="M14 11h4l3 3v2h-2"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg> Ücretsiz Kargo</span>
          <span><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg> 14 Gün İade</span>
        </div>
      </div>
    </div>
  `;

  // Event listener'ları yeniden bağla
  window.renderCartPage = renderCartPage;
}

/* Kupon sunucuda doğrulanır (js/cart.js → applyCoupon): bu yüzden akış
   asenkron, buton da istek boyunca kilitli tutulur. */
async function handleCoupon(btn) {
  const code  = document.getElementById('coupon-input')?.value || '';
  const msgEl = document.getElementById('coupon-msg');

  if (btn) { btn.disabled = true; btn.textContent = 'Kontrol ediliyor…'; }
  msgEl.style.color = 'var(--text-secondary)';
  msgEl.textContent = 'Kupon kontrol ediliyor…';

  let result;
  try {
    result = await applyCoupon(code);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Uygula'; }
  }

  if (result.valid) {
    appliedCoupon  = result;
    couponDiscount = result.discount;
    msgEl.style.color = 'var(--success)';
    msgEl.textContent = result.msg;
    showToast(result.msg, 'success');
    renderCartPage();
  } else {
    appliedCoupon  = null;
    couponDiscount = 0;
    msgEl.style.color = 'var(--error)';
    msgEl.textContent = result.msg;
    showToast(result.msg, 'error');
  }
}
</script>
